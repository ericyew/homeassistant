blueprint:
  name: Alarmo actionable notifications when entering/leaving a zone (Android)
  description: >
    Sends actionable Android notifications when a person enters or leaves a zone
    AND your Alarmo alarm system is in a certain state. Supports up to three
    action buttons, which can open URIs/apps or execute HA actions.

  domain: automation

  input:
    notify_device:
      name: Device to notify
      description: Device must be using the official Home Assistant app.
      selector:
        device:
          integration: mobile_app

    trigger_entity:
      name: Person to track
      selector:
        entity:
          domain: person

    trigger_event:
      name: Trigger Type
      description: Notify on entering or leaving the zone.
      selector:
        select:
          options:
            - enter
            - leave

    trigger_zone:
      name: Zone
      selector:
        entity:
          domain: zone

    alarm_entity:
      name: Alarmo Alarm Entity
      description: Typically alarm_control_panel.alarmo
      selector:
        entity:
          domain: alarm_control_panel

    alarm_required_state:
      name: Required Alarmo State
      description: Only send the notification when Alarmo is in this state.
      selector:
        select:
          options:
            - disarmed
            - armed_away
            - armed_home
            - armed_night
            - armed_vacation

    notification_title:
      name: Notification Title
      default: ""

    notification_message:
      name: Notification Message
      default: ""

    persistent_notification:
      name: Persistent Notification?
      description: When enabled, notification cannot be dismissed by swiping.
      default: false
      selector:
        boolean: {}

    # --- Action Button 1 ---
    action_1_title:
      name: Action 1 Title
      default: ""

    action_1_uri:
      name: Action 1 URI (Optional)
      description: If provided, it overrides the HA action sequence.
      default: ""

    action_1_actions:
      name: Action 1 - Home Assistant Actions
      default: []
      selector:
        action: {}

    # --- Action Button 2 ---
    action_2_title:
      name: Action 2 Title
      default: ""

    action_2_uri:
      name: Action 2 URI (Optional)
      default: ""

    action_2_actions:
      name: Action 2 - Home Assistant Actions
      default: []
      selector:
        action: {}

    # --- Action Button 3 ---
    action_3_title:
      name: Action 3 Title
      default: ""

    action_3_uri:
      name: Action 3 URI (Optional)
      default: ""

    action_3_actions:
      name: Action 3 - Home Assistant Actions
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  titles: [!input action_1_title, !input action_2_title, !input action_3_title]
  uris:   [!input action_1_uri,   !input action_2_uri,   !input action_3_uri]

trigger:
  - platform: zone
    entity_id: !input trigger_entity
    zone: !input trigger_zone
    event: !input trigger_event

condition:
  - condition: state
    entity_id: !input alarm_entity
    state: !input alarm_required_state

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "{{ notification_title }}"
    message: "{{ notification_message }}"
    data:
      persistent: {{ persistent_notification }}
      tag: "{{ notification_title }}"
      actions: >
        {% set output = [] %}
        {% for title in titles %}
          {% if title %}
            {% set uri = uris[loop.index0] %}
            {% set action_id = "action" ~ loop.index %}
            {% set output = output + [{
              "action": (uri and "uri") or action_id,
              "title": title,
              "uri": uri
            }] %}
          {% endif %}
        {% endfor %}
        {{ output }}

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action

  - choose:
      - conditions: "{{ wait.trigger.event.data.action == 'action1' }}"
        sequence: !input action_1_actions
      - conditions: "{{ wait.trigger.event.data.action == 'action2' }}"
        sequence: !input action_2_actions
      - conditions: "{{ wait.trigger.event.data.action == 'action3' }}"
        sequence: !input action_3_actions
